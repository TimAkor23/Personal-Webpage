      <button class="btn nba-btn" onclick="generateNBAFact()">🏀 Generate NBA Fact</button>
      <p id="nba-fact" class="fact-box"></p>
    </div>

  <script>
    const facts = [
      "Michael Jordan won 6 championships with the Bulls.",
      "LeBron James is the only player with 40,000+ career points.",
      "Steph Curry holds the record for most 3-pointers made.",
      "Wilt Chamberlain once scored 100 points in a single game.",
      "Kareem Abdul-Jabbar held the scoring record for 39 years.",
      "Shaquille O’Neal made only one career three-pointer.",
      "The NBA added the 3-point line in 1979.",
      "Muggsy Bogues was only 5'3\" tall.",
      "The Boston Celtics have the most NBA championships.",
      "Kobe Bryant scored 81 points in a single game.",
      "Bam Adebayo scored 83 point in a single game.",
      "Lebron James is the all time leading scorer in the Nba.",
      "There are 30 teams in Nba.",
      "Lebron James and Bronny James are the only father son duo to play on the same team",
      "Dennis Rodman once grabbed 34 rebounds in one game.",
      "A regulation basketball hoop is ten feet high.",
      "Players are not allowed to wear the number 69.",
      "George Muresan is the tallest player ever standing at 7'7.",
      "A regulated court is 94 ft long and 50 ft wide.",
      "The first basketball hoops had bottoms on them. Someone would have to climb on a ladder everyone someone scored",
      "The fastest record nba shot was 118mph.",
      "The 2016 Golden State Warriors hold the record of 73 wins in a 82 game season record",
      "Jerry West is the inspired silhouette to the nba logo",
      "A basketball has about 35,000 tiny bumps called pebbles to help players grip the ball better",
    ];

    function typeText(element, text, speed = 35) {
      element.textContent = "";
      let i = 0;

      function type() {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
          setTimeout(type, speed);
        }
      }
      type();
    }

    function generateNBAFact() {
      const factBox = document.getElementById("nba-fact");

      const randomFact = facts[Math.floor(Math.random() * facts.length)];

      factBox.classList.remove("bounce");
      void factBox.offsetWidth;
      factBox.classList.add("bounce");

      typeText(factBox, randomFact);
    }
  </script>
